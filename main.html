<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Volume Subdivision (WebGPU)</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #e8e8ee;
            font: 13px/1.4 system-ui, sans-serif;
        }

        /* 캔버스를 화면에 꽉 채움 (실제 해상도는 main.js 에서 맞춤) */
        #gpuCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: grab;
            touch-action: none;
        }
        #gpuCanvas:active { cursor: grabbing; }

        #ui {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 220px;
            padding: 12px 14px;
            background: rgba(20, 20, 24, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            user-select: none;
        }
        #ui h3 { margin: 0 0 8px; font-size: 14px; }
        #ui hr { border: 0; border-top: 1px solid rgba(255, 255, 255, 0.12); margin: 8px 0; }
        #ui .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0;
        }
        #ui .row span { color: #b8b8c4; }
        #ui .row b { font-variant-numeric: tabular-nums; }
        #ui input[type="color"] {
            width: 36px;
            height: 22px;
            border: 0;
            padding: 0;
            background: none;
            cursor: pointer;
        }
        #ui input[type="checkbox"] { cursor: pointer; }
        #ui label.row { cursor: pointer; }
        #ui input[type="range"] { width: 100%; margin: 2px 0 6px; cursor: pointer; }

        #ui button {
            width: 100%;
            margin-top: 6px;
            padding: 6px 0;
            background: rgba(255, 255, 255, 0.1);
            color: inherit;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 6px;
            cursor: pointer;
        }
        #ui button:hover { background: rgba(255, 255, 255, 0.18); }

        #ui .hint { margin-top: 8px; font-size: 11.5px; color: #8c8c99; line-height: 1.5; }
    </style>
</head>
<body>
    <canvas id="gpuCanvas"></canvas>

    <div id="ui">
        <h3>Volume Subdivision</h3>

        <div class="row"><span>FPS</span><b id="stat-fps">-</b></div>
        <div class="row"><span>정점</span><b id="stat-v">-</b></div>
        <div class="row"><span>삼각형</span><b id="stat-t">-</b></div>
        <div class="row"><span>엣지</span><b id="stat-e">-</b></div>

        <hr>

        <div class="row"><span>서브디비전 레벨</span><b id="level-label">-</b></div>
        <input type="range" id="level-slider" min="1" max="3" step="1" value="3">

        <hr>

        <label class="row"><span>면 표시</span><input type="checkbox" id="chk-faces" checked></label>
        <label class="row"><span>와이어프레임</span><input type="checkbox" id="chk-wire" checked></label>

        <div class="row"><span>면 색</span><input type="color" id="col-face" value="#ffb300"></div>
        <div class="row"><span>선 색</span><input type="color" id="col-wire" value="#333333"></div>
        <div class="row"><span>배경색</span><input type="color" id="col-bg" value="#808080"></div>

        <button id="btn-reset">카메라 리셋</button>

        <div class="hint">
            좌클릭 드래그: 회전<br>
            우클릭 / Shift+드래그: 이동<br>
            휠: 줌 &nbsp;·&nbsp; 더블클릭 / R: 리셋
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
